name: OpenSpec

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# Every step invokes a just recipe rather than repeating its command, so a
# check cannot pass locally and differ here. See build-packaging, "CI runs the
# same recipes".
jobs:
  sanitizers:
    name: address-and-undefined-behaviour
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v2
    - name: Install SPIR-V validator
      run: sudo apt-get update && sudo apt-get install -y spirv-tools
    - name: Sanitized tests
      run: just test-sanitize
    - name: Project container fuzz gate
      run: just fuzz-project-container
    - name: Image decoder fuzz gate
      run: just fuzz-image-decoders
    - name: Upload fuzz reproducers
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-reproducers
        path: build/fuzz-artifacts
        if-no-files-found: ignore

  build:
    name: build-and-layering
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v2
    - name: Install graphics test dependencies
      run: sudo apt-get update && sudo apt-get install -y spirv-tools libvulkan1 mesa-vulkan-drivers
    - name: Build
      run: just build
    - name: Formatting
      run: just format-check
    - name: Module layering
      run: just gate-layering
    - name: Version consistency
      run: just gate-version-consistency
    - name: Binding surface parity
      run: just gate-binding-parity
    - name: ABI compatibility
      run: just gate-abi-diff
    - name: Dependency licences
      run: just gate-licence
    - name: Task runner contract
      run: just gate-task-runner
    - name: Reproducible shipped library
      run: just gate-reproducible
    - name: Tiled image storage
      run: just test-image
    - name: Headless colour transforms
      run: just test-color
    - name: Slice-A PNG IO
      run: just test-png
    - name: Semantic document channels
      run: just test-channels
    - name: Host transport scenarios
      run: just test-host-transport-scenarios
    - name: Texture-document scenarios
      run: just test-texture-document-scenarios
    - name: Read-only mesh ingest
      run: just test-mesh
    - name: Picking scenarios
      run: just test-picking-scenarios
    - name: Material graph document
      run: just test-graph-document
    - name: Material graph cycle detection
      run: just test-graph-cycles
    - name: Material graph socket links
      run: just test-graph-sockets
    - name: Material graph catalogue
      run: just test-graph-catalogue
    - name: Material graph groups
      run: just test-graph-groups
    - name: Material graph validation
      run: just test-graph-validation
    - name: Host material nodes
      run: just test-graph-host-nodes
    - name: Kong context isolation
      run: just test-kong-context
    - name: Graph emission
      run: just test-graph-emission
    - name: Device-independent pass plans
      run: just test-pass-plan
    - name: Executor parity corpus
      run: just gate-parity
    - name: Optional owned Vulkan executor
      run: just test-vulkan
    - name: Execution backend scenarios
      run: just test-execution-backend-scenarios
    - name: Examples scenarios
      run: just test-examples-scenarios
    - name: Build and packaging scenarios
      run: just test-build-packaging-scenarios
    - name: Reference host contract
      run: just gate-reference-hosts
    - name: Test suite
      run: just test

  cli-smoke:
    name: cli-smoke-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - uses: extractions/setup-just@v2
    - name: Build and exercise every CLI route
      run: just test-cli

  python-wheel:
    name: python-wheel-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: extractions/setup-just@v2
    - name: Minimum supported Python wheel
      run: just test-python-binding
      env:
        CTEX_PYTHON_VERSION: '3.10'
    - name: Current supported Python wheel
      run: just test-python-binding
      env:
        CTEX_PYTHON_VERSION: '3.14'

  examples:
    name: python-examples-and-gallery
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: extractions/setup-just@v2
    - name: Run examples and compare committed gallery outputs
      run: just examples

  desktop-packages:
    name: package-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          preset: linux
          scope: linux-x64
        - os: macos-15-intel
          preset: macos
          scope: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - uses: extractions/setup-just@v2
    - name: Build and smoke-test package
      run: just package-${{ matrix.preset }}
    - name: Decide this platform package
      run: just gate-packages ${{ matrix.scope }}
    - uses: actions/upload-artifact@v4
      with:
        name: cybertexel-${{ matrix.preset }}
        path: dist/*.zip

  ios-package:
    name: package-ios-arm64
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: extractions/setup-just@v2
    - name: Build and link-smoke iOS package
      run: just package-ios
    - name: Decide this platform package
      run: just gate-packages ios-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: cybertexel-ios
        path: dist/*.zip

  # Deferred to task 18.6: the first release slice is macOS, Linux and iPad.
  # Kept runnable by name so the recipe cannot rot while it is out of scope.
  android-package:
    name: package-android-arm64
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: android-actions/setup-android@v3
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;27.2.12479018"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
    - uses: extractions/setup-just@v2
    - name: Build and link-smoke Android package
      run: just package-android
    - uses: actions/upload-artifact@v4
      with:
        name: cybertexel-android
        path: dist/*.zip

  # Task 18.2: the reference hosts link real device APIs. Exit code 3 means the
  # runner had no adapter, which is unmeasured, not a pass.
  reference-hosts:
    name: reference-host-${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15-intel
          host: desktop-wgsl
          recipe: host-desktop
        - os: ubuntu-latest
          host: desktop-wgsl-linux
          recipe: host-desktop
        - os: macos-15-intel
          host: mobile-msl
          recipe: host-ipad
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: extractions/setup-just@v2
    - name: Install graphics dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
    - name: Install pkg-config
      if: matrix.recipe == 'host-ipad'
      run: brew install pkgconf
    - name: Run the reference host
      run: just ${{ matrix.recipe }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reference-host-${{ matrix.host }}
        path: build/reference-hosts/*.json
        if-no-files-found: ignore

  swift-package:
    name: swift-package-macos-ios
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v2
    - name: Install pkg-config
      run: brew install pkgconf
    - name: Build and test Swift package
      run: just test-swift-binding

  rust-crates:
    name: rust-crates-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy,rustfmt
    - uses: extractions/setup-just@v2
    - name: Build and test Rust crates
      run: just test-rust-binding

  check-spec:
    name: check-spec
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: extractions/setup-just@v2
    - name: Install OpenSpec
      run: npm install -g @fission-ai/openspec@latest
    - name: Prerequisites
      run: just prereqs
    - name: Specification checks
      run: just check-spec
    - name: Counts
      run: just spec-stats
