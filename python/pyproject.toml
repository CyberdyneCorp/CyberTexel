[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertexel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybertexel = ["_native_lib/*"]
