name: OpenSpec

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# Every step invokes a just recipe rather than repeating its command, so a
# check cannot pass locally and differ here. See build-packaging, "CI runs the
# same recipes".
jobs:
  check-spec:
    name: check-spec
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: extractions/setup-just@v2
    - name: Install OpenSpec
      run: npm install -g @fission-ai/openspec@latest
    - name: Prerequisites
      run: just prereqs
    - name: Specification checks
      run: just check-spec
    - name: Counts
      run: just spec-stats
