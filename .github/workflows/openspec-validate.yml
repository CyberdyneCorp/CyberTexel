name: OpenSpec

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# Every step invokes a just recipe rather than repeating its command, so a
# check cannot pass locally and differ here. See build-packaging, "CI runs the
# same recipes".
jobs:
  sanitizers:
    name: address-and-undefined-behaviour
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v2
    - name: Sanitized tests
      run: just test-sanitize

  build:
    name: build-and-layering
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v2
    - name: Build
      run: just build
    - name: Formatting
      run: just format-check
    - name: Module layering
      run: just gate-layering
    - name: Version consistency
      run: just gate-version-consistency
    - name: Dependency licences
      run: just gate-licence
    - name: Tiled image storage
      run: just test-image
    - name: Headless colour transforms
      run: just test-color
    - name: Slice-A PNG IO
      run: just test-png
    - name: Semantic document channels
      run: just test-channels
    - name: Texture-set document
      run: just test-document
    - name: Read-only mesh ingest
      run: just test-mesh
    - name: Picking scenarios
      run: just test-picking-scenarios
    - name: Material graph document
      run: just test-graph-document
    - name: Material graph cycle detection
      run: just test-graph-cycles
    - name: Material graph socket links
      run: just test-graph-sockets
    - name: Material graph catalogue
      run: just test-graph-catalogue
    - name: Material graph groups
      run: just test-graph-groups
    - name: Material graph validation
      run: just test-graph-validation
    - name: Test suite
      run: just test

  check-spec:
    name: check-spec
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: extractions/setup-just@v2
    - name: Install OpenSpec
      run: npm install -g @fission-ai/openspec@latest
    - name: Prerequisites
      run: just prereqs
    - name: Specification checks
      run: just check-spec
    - name: Counts
      run: just spec-stats
